[functions.send-notification]
# La fonction ne se sert jamais du JWT de l'appelant (elle relaie juste vers Resend avec sa
# propre clé secrète) — désactivé pour ne pas dépendre du format de la clé anon utilisée côté
# client (l'app supporte déjà l'ancien format eyJ... et le nouveau sb_publishable_...).
verify_jwt = false

[functions.send-sms]
# Même raison que send-notification ci-dessus.
verify_jwt = false

[functions.login]
# C'est le point d'entrée AVANT authentification (login lui-même) — impossible d'exiger un JWT
# préalable ici. La vérification se fait manuellement dans la fonction (code → employees).
verify_jwt = false
